<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REGISTER</title>
  </head>
  <body>
    <h2>Create An Account</h2>
    <form id="regForm">
      <input
        type="text"
        id="username"
        ,
        placeholder="Username"
        ,
        required
      /><br /><br />
      <input
        type="email"
        ,
        id="email"
        ,
        placeholder="Email"
        ,
        required
      /><br /><br />
      <input
        type="password"
        ,
        id="password"
        ,
        placeholder="Password"
        ,
        required
      /><br /><br />
      <button type="submit">REGISTER</button>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
